<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="eq-title">
  <title id="eq-title">Trois artisans Plomberie Élite en tenue sombre à liseré bleu devant un mur technique en laiton et cuivre</title>
  <defs>
    <linearGradient id="eq-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A2E"/>
      <stop offset=".55" stop-color="#12121C"/>
      <stop offset="1" stop-color="#0A0A0F"/>
    </linearGradient>
    <radialGradient id="eq-ambient" cx=".56" cy=".3" r=".62">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".36"/>
      <stop offset=".5" stop-color="#3B82F6" stop-opacity=".09"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eq-warm" cx=".41" cy=".07" r=".22">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <!-- laiton : dégradé horizontal (pièces verticales) et vertical (pièces horizontales) -->
    <linearGradient id="eq-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350F"/>
      <stop offset=".3" stop-color="#F59E0B"/>
      <stop offset=".5" stop-color="#FDE68A"/>
      <stop offset=".72" stop-color="#D97706"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="eq-brass-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350F"/>
      <stop offset=".3" stop-color="#F59E0B"/>
      <stop offset=".5" stop-color="#FDE68A"/>
      <stop offset=".72" stop-color="#D97706"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="eq-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset=".35" stop-color="#64748B"/>
      <stop offset=".6" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="eq-dial" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#1A1A2E"/>
      <stop offset="1" stop-color="#0A0A0F"/>
    </radialGradient>
    <linearGradient id="eq-jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23293F"/>
      <stop offset=".35" stop-color="#161A29"/>
      <stop offset="1" stop-color="#0B0C13"/>
    </linearGradient>
    <radialGradient id="eq-head" cx=".36" cy=".34" r=".75">
      <stop offset="0" stop-color="#2B3149"/>
      <stop offset="1" stop-color="#10121C"/>
    </radialGradient>
    <linearGradient id="eq-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0F" stop-opacity="0"/>
      <stop offset=".42" stop-color="#0A0A0F" stop-opacity=".84"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity=".98"/>
    </linearGradient>
    <radialGradient id="eq-vignette" cx=".5" cy=".42" r=".78">
      <stop offset=".62" stop-color="#0A0A0F" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity=".75"/>
    </radialGradient>
    <filter id="eq-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="eq-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Artisan stylisé : origine au centre de la tête -->
    <g id="eq-artisan">
      <rect x="-17" y="30" width="34" height="44" fill="#141725"/>
      <path d="M-128 600 L-122 190 C-120 130 -92 100 -48 88 L-22 80 L22 80 L48 88 C92 100 120 130 122 190 L128 600 Z" fill="url(#eq-jacket)"/>
      <!-- col montant -->
      <path d="M-36 82 L0 132 L36 82 L24 76 L0 110 L-24 76 Z" fill="#0D0F18"/>
      <path d="M-30 84 L0 128 L30 84" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linejoin="round"/>
      <!-- liseré bleu : empiècements d'épaule et patte de boutonnage -->
      <path d="M-118 170 Q-72 146 -28 140 M118 170 Q72 146 28 140" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-opacity=".8"/>
      <path d="M0 128 V600" stroke="#3B82F6" stroke-width="2" stroke-opacity=".5"/>
      <!-- coutures de manches et poche -->
      <path d="M-94 204 C-99 300 -99 440 -95 600 M94 204 C99 300 99 440 95 600" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="2"/>
      <path d="M-80 212 h46 v42 h-46 z" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.5"/>
      <rect x="34" y="182" width="40" height="11" rx="3" fill="url(#eq-brass)" opacity=".85"/>
      <!-- lumière de contre-jour bleutée -->
      <path d="M48 88 C92 100 120 130 122 190 L128 600" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-opacity=".5"/>
      <path d="M-48 88 C-92 100 -120 130 -122 190 L-128 600" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-opacity=".14"/>
      <!-- tête : forme simple, sans traits -->
      <ellipse cx="0" cy="0" rx="40" ry="50" fill="url(#eq-head)"/>
      <path d="M24 -40 A40 50 0 0 1 32 30" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-opacity=".55" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Mur technique -->
  <rect width="800" height="1000" fill="url(#eq-wall)"/>
  <rect width="800" height="1000" fill="url(#eq-ambient)"/>
  <rect width="800" height="1000" fill="url(#eq-warm)"/>
  <g stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1.5">
    <path d="M160 0V1000M320 0V1000M480 0V1000M640 0V1000"/>
    <path d="M0 560H800"/>
  </g>
  <g fill="#FFFFFF" fill-opacity=".06">
    <circle cx="160" cy="40" r="2.5"/><circle cx="320" cy="40" r="2.5"/><circle cx="480" cy="40" r="2.5"/><circle cx="640" cy="40" r="2.5"/>
    <circle cx="160" cy="540" r="2.5"/><circle cx="480" cy="540" r="2.5"/><circle cx="640" cy="540" r="2.5"/>
  </g>

  <!-- Tuyauterie cuivre (base sombre, corps cuivré, reflet central) -->
  <g fill="none" stroke-linecap="butt">
    <g stroke="#5B210B" stroke-width="30">
      <path d="M-30 170H450a60 60 0 0 1 60 60v540"/>
      <path d="M830 120H720a50 50 0 0 0-50 50v620"/>
    </g>
    <g stroke="#B45309" stroke-width="22">
      <path d="M-30 170H450a60 60 0 0 1 60 60v540"/>
      <path d="M830 120H720a50 50 0 0 0-50 50v620"/>
    </g>
    <g stroke="#FDBA74" stroke-width="5" stroke-opacity=".55">
      <path d="M-30 170H450a60 60 0 0 1 60 60v540"/>
      <path d="M830 120H720a50 50 0 0 0-50 50v620"/>
    </g>
    <!-- conduite secondaire chromée -->
    <path d="M-30 330H150a40 40 0 0 0 40-40V-30" stroke="#1E293B" stroke-width="18"/>
    <path d="M-30 330H150a40 40 0 0 0 40-40V-30" stroke="#475569" stroke-width="12"/>
    <path d="M-30 330H150a40 40 0 0 0 40-40V-30" stroke="#CBD5E1" stroke-width="3" stroke-opacity=".45"/>
    <path d="M830 380H740" stroke="#1E293B" stroke-width="18"/>
    <path d="M830 380H740" stroke="#475569" stroke-width="12"/>
    <path d="M830 380H740" stroke="#CBD5E1" stroke-width="3" stroke-opacity=".45"/>
  </g>

  <!-- Colliers de fixation -->
  <g fill="#0F1220" stroke="#FFFFFF" stroke-opacity=".12">
    <rect x="72" y="150" width="14" height="40" rx="3"/>
    <rect x="252" y="150" width="14" height="40" rx="3"/>
    <rect x="650" y="300" width="40" height="14" rx="3"/>
    <rect x="490" y="330" width="40" height="14" rx="3"/>
    <rect x="180" y="96" width="20" height="12" rx="3"/>
  </g>

  <!-- Raccords laiton -->
  <rect x="388" y="148" width="24" height="44" rx="4" fill="url(#eq-brass-v)"/>
  <rect x="648" y="470" width="44" height="24" rx="4" fill="url(#eq-brass)"/>
  <rect x="488" y="410" width="44" height="22" rx="4" fill="url(#eq-brass)"/>
  <rect x="728" y="364" width="14" height="32" rx="3" fill="url(#eq-brass-v)"/>

  <!-- Vanne quart de tour (poignée bleue) -->
  <rect x="136" y="144" width="48" height="52" rx="7" fill="url(#eq-brass-v)"/>
  <rect x="130" y="152" width="8" height="36" rx="2" fill="url(#eq-brass-v)"/>
  <rect x="182" y="152" width="8" height="36" rx="2" fill="url(#eq-brass-v)"/>
  <rect x="155" y="112" width="10" height="34" fill="url(#eq-brass)"/>
  <rect x="114" y="100" width="96" height="14" rx="7" fill="#2563EB"/>
  <rect x="120" y="102" width="80" height="3" rx="1.5" fill="#93C5FD" opacity=".6"/>

  <!-- Vanne à volant -->
  <rect x="644" y="222" width="52" height="56" rx="7" fill="url(#eq-brass)"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="670" cy="250" r="38" stroke="#92400E" stroke-width="11"/>
    <circle cx="670" cy="250" r="38" stroke="#F59E0B" stroke-width="7"/>
    <path d="M644 226a38 38 0 0 1 40-12" stroke="#FDE68A" stroke-width="2.5" stroke-opacity=".8"/>
    <path d="M670 212V288M632 250H708M643 223 697 277M697 223 643 277" stroke="#B45309" stroke-width="5"/>
  </g>
  <circle cx="670" cy="250" r="10" fill="url(#eq-brass)"/>

  <!-- Manomètre -->
  <rect x="322" y="116" width="16" height="44" fill="url(#eq-brass)"/>
  <rect x="312" y="126" width="36" height="14" rx="3" fill="url(#eq-brass-v)"/>
  <circle cx="330" cy="76" r="50" fill="url(#eq-chrome)"/>
  <circle cx="330" cy="76" r="42" fill="url(#eq-dial)"/>
  <path d="M307.37 98.63A32 32 0 1 1 352.63 98.63" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="7" stroke-dasharray="1.2 5.5"/>
  <path d="M341 45.9A32 32 0 0 1 352.63 98.63" fill="none" stroke="#3B82F6" stroke-width="3" stroke-opacity=".85"/>
  <path d="M330 76 L330 48" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round" transform="rotate(38 330 76)"/>
  <circle cx="330" cy="76" r="6" fill="url(#eq-brass)"/>
  <path d="M296 70a36 36 0 0 1 30-30" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="8" stroke-linecap="round"/>

  <!-- Halo bleuté derrière l'équipe -->
  <ellipse cx="410" cy="560" rx="300" ry="210" fill="#3B82F6" opacity=".22" filter="url(#eq-blur)"/>
  <ellipse cx="400" cy="440" rx="120" ry="90" fill="#93C5FD" opacity=".12" filter="url(#eq-blur)"/>

  <!-- Artisan de gauche (casquette) -->
  <g transform="translate(205 488) scale(.92)">
    <use href="#eq-artisan"/>
    <path d="M-42 -10 C-42 -56 42 -56 42 -10 Z" fill="#131726"/>
    <path d="M-40 -18 C-14 -26 14 -26 40 -18" fill="none" stroke="#3B82F6" stroke-width="3" stroke-opacity=".75"/>
    <path d="M-46 -8 Q0 6 46 -8" fill="none" stroke="#0A0B12" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Artisane de droite (chignon) -->
  <g transform="translate(598 478) scale(.95)">
    <use href="#eq-artisan"/>
    <circle cx="4" cy="-58" r="16" fill="#0B0C14"/>
    <path d="M-41 -4 C-44 -44 -20 -52 0 -52 C24 -52 44 -42 41 -4 C36 -28 20 -36 0 -36 C-20 -36 -36 -26 -41 -4 Z" fill="#0B0C14"/>
    <path d="M18 -48 C30 -44 38 -34 40 -20" fill="none" stroke="#93C5FD" stroke-width="2" stroke-opacity=".45" stroke-linecap="round"/>
  </g>

  <!-- Artisan central (au premier plan) -->
  <g transform="translate(400 436)">
    <use href="#eq-artisan"/>
    <path d="M-41 -6 C-43 -46 -18 -54 0 -54 C24 -54 43 -44 41 -6 C35 -30 20 -38 0 -38 C-20 -38 -35 -30 -41 -6 Z" fill="#0B0C14"/>
    <path d="M16 -50 C30 -46 38 -36 40 -22" fill="none" stroke="#93C5FD" stroke-width="2" stroke-opacity=".5" stroke-linecap="round"/>
  </g>

  <!-- Reflets d'ambiance -->
  <g fill="#FFFFFF" opacity=".03">
    <path d="M540 0H620L360 1000H280Z"/>
    <path d="M660 0H690L430 1000H400Z"/>
  </g>
  <path d="M0 196H800" stroke="#93C5FD" stroke-opacity=".08" stroke-width="1" filter="url(#eq-soft)"/>

  <!-- Dernier quart sombre et calme (carte en verre superposée) -->
  <rect x="0" y="600" width="800" height="400" fill="url(#eq-fade)"/>
  <rect width="800" height="1000" fill="url(#eq-vignette)"/>
</svg>
