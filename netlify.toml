# Netlify — site statique, pas de build. Les formulaires (data-netlify) sont détectés au déploiement.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Les sources _partials/ (déjà fusionnées dans styles.css / script.js) ne sont pas servies.
[[redirects]]
  from = "/_partials/*"
  to = "/404.html"
  status = 404
  force = true
